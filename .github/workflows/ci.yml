name: ci
on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: asan + ubsan
        run: |
          for t in bench tex_bench video_bench; do
            ${{ matrix.cc }} -std=c11 -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=undefined -Wall -Wextra -pedantic -pthread $t.c -o $t -lm
            ./$t
          done
      - run: ${{ matrix.cc }} -std=c11 -O1 -g -fsanitize=thread -pthread bench.c -o bench_tsan
      - run: ./bench_tsan
